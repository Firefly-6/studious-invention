name: 更新俄国新闻

on:
  schedule:
    - cron: '*/30 * * * *'   # 每 30 分钟（GitHub 免费层，实际可能略有延迟）
  workflow_dispatch: {}       # 也支持在 Actions 页面手动“Run workflow”立即跑一次

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取并生成 news.json
        run: node build.js

      - name: 提交 news.json（有变化才提交）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 更新俄国新闻 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
